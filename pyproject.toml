[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "food-calorie-project"
version = "0.1.0"
description = "Food image classification and portion-based calorie estimation course project"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3", "torchvision>=0.17,<1", "Pillow>=10", "matplotlib>=3.7,<4", "requests>=2.31,<3"]

[project.scripts]
foodcal = "foodcal.cli:main"

[tool.setuptools.packages.find]
include = ["foodcal*"]

[tool.setuptools.package-data]
foodcal = ["static/*.html", "static/*.js"]
